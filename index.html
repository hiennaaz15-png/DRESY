<!doctype html>
<html lang="vi">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFCFD">
<title>Dresy – Dress so easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2430; --ink2:#3D4550; --muted:#646C78; --line:#ECEEF2; --field:#F8F9FB; --fieldline:#E2E5EA;
  --bg:#FCFCFD; --card:#FFFFFF; --blue:#2F5F8A; --blue-soft:#E3EEF8; --blue-ink:#24456A;
  --blush:#FBF1F3; --blush2:#F6E3E8; --rose:#9B3D55; --spark:#E7A3B3; --danger:#B4233C;
  --serif:'Playfair Display',Georgia,serif; --sans:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:#EEF2F6;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid #9DBEDD;outline-offset:2px}
#app{position:relative;max-width:440px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){
  body{padding:32px 0}
  #app{height:860px;border-radius:44px;box-shadow:0 30px 80px rgba(31,36,48,.14)}
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 20px 6px;min-height:56px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:8px 24px 16px;display:flex;flex-direction:column;gap:14px}
.foot{padding:10px 24px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:4px}
h1{margin:0;font-family:var(--serif);font-style:italic;font-weight:600;font-size:32px;line-height:1.12}
.serif{font-family:var(--serif);font-style:italic;font-weight:600}
.sub{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
.eyebrow{font-size:13px;font-weight:600;color:var(--blue)}
.small{font-size:12px;line-height:1.45;color:var(--muted)}
.wordmark{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-style:italic;font-weight:600;font-size:23px}
.seg{display:flex;background:#F0F2F5;border-radius:999px;padding:3px}
.seg button{height:32px;min-width:42px;padding:0 10px;border:0;border-radius:999px;font-weight:600;font-size:13px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,40,.15)}
.icon-btn{width:44px;height:44px;border-radius:999px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--blue)}
.btn{height:52px;border-radius:999px;border:0;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 20px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:disabled{background:#C7D1DB;cursor:default}
.btn-dark{background:#111214;color:#fff}
.btn-outline{background:#fff;color:var(--ink);border:1.5px solid #D5DAE1}
.btn-soft{background:var(--blue-soft);color:var(--blue-ink)}
.btn-text{height:44px;border:0;background:transparent;color:var(--blue);font-weight:600;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.input{width:100%;height:48px;padding:0 14px;border-radius:16px;border:1.5px solid var(--fieldline);background:var(--field);font-size:16px;color:var(--ink)}
.input:focus{border-color:var(--blue);background:#fff;outline:none}
.rel{position:relative}
.suffix{position:absolute;right:14px;top:14px;font-size:14px;color:var(--muted)}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--fieldline)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--ink2);min-height:44px}
.check input{width:22px;height:22px;margin:0;accent-color:var(--blue);flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.row{flex-wrap:nowrap;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.chip{flex-shrink:0;height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--fieldline);background:#fff;color:var(--ink);font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:20px;background:var(--blue-soft);font-size:13px;line-height:1.5;color:#24303D}
.note svg{flex-shrink:0}
.switch{position:relative;flex-shrink:0;width:51px;height:31px;border:0;border-radius:999px;padding:0;background:#C7D1DB;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.switch[aria-checked="true"]{background:var(--blue)}
.switch[aria-checked="true"]::after{left:22px}
.progress{display:flex;gap:6px;flex:1;max-width:120px}
.progress span{flex:1;height:5px;border-radius:999px;background:#DDE3EA}
.progress span.on{background:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 6px 24px rgba(31,36,48,.05)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.swatch{width:44px;height:44px;border-radius:999px;border:1.5px solid rgba(20,30,40,.15)}
.list-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-bottom:1px solid #EEF0F3}
.list-row:last-child{border-bottom:0}
.dot{width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#EEF0F3;color:var(--muted)}
.dot.ok{background:var(--blue);color:#fff}
.tabbar{display:flex;padding:4px 6px calc(env(safe-area-inset-bottom) + 8px);background:rgba(255,255,255,.96);border-top:1px solid var(--line)}
.tabbar button{flex:1;min-height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#646C78;font-size:10.5px;font-weight:600}
.tabbar button[aria-current="page"]{color:var(--blue)}
.tile{display:flex;flex-direction:column;gap:8px;padding:10px 10px 12px;border-radius:22px;background:#fff;border:1px solid var(--line)}
.tile .img{height:120px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.tag{font-size:12px;padding:4px 10px;border-radius:999px;background:#F4F6F9;color:var(--ink2)}
.tag.blue{background:var(--blue-soft);color:var(--blue-ink)}
.fab{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom) + 84px);height:52px;padding:0 20px 0 16px;border-radius:999px;border:0;background:var(--blue);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(47,95,138,.3)}
.overlay{position:absolute;inset:0;background:rgba(20,24,32,.42);display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.sheet{border-radius:32px 32px 0 0;background:#fff;padding:10px 22px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.grabber{width:38px;height:5px;border-radius:999px;background:#D9DDE3;margin:0 auto}
.plan{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 16px;border-radius:20px;border:1.5px solid var(--fieldline);background:#fff;text-align:left;width:100%}
.plan[aria-checked="true"]{border:2px solid var(--blue);background:#F2F7FC}
.radio{width:20px;height:20px;border-radius:999px;border:1.5px solid #B9C1CC;flex-shrink:0}
.plan[aria-checked="true"] .radio{border:6px solid var(--blue)}
.scan{flex:1;display:flex;flex-direction:column;background:#14171D;color:#fff}
.frame{position:relative;margin:12px 20px 0;border-radius:28px;display:flex;align-items:center;justify-content:center;padding-top:20px}
.badge{position:absolute;top:14px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px}
.shutter{width:76px;height:76px;border-radius:999px;border:4px solid rgba(255,255,255,.5);background:#fff;background-clip:content-box;padding:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function element(year) {
  const can = [4,4,5,5,1,1,2,2,3,3][year % 10];
  const chi = [0,0,1,1,2,2,0,0,1,1,2,2][((year - 4) % 12 + 12) % 12];
  let n = can + chi; if (n > 5) n -= 5;
  return [null,0,1,2,3,4][n]; // 0 Kim, 1 Thủy, 2 Hỏa, 3 Thổ, 4 Mộc
}

  if (st === 1) {
    body = `

      <button class="btn btn-outline" data-act="social">${x.google}</button>
      <div class="divider">${x.or}</div>
      <div class="field"><label for="f-name">${x.nameL}</label><input class="input" id="f-name" data-f="name" autocomplete="name" enterkeyhint="next" placeholder="${x.namePh}" value="${esc(S.name)}"></div>
      <div class="field"><label for="f-email">Email</label><input class="input" id="f-email" data-f="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" enterkeyhint="next" placeholder="${x.emailPh}" value="${esc(S.email)}"></div>
      <div class="field"><label for="f-pass">${x.passL}</label>
        <div class="rel"><input class="input" id="f-pass" data-f="pass" type="${S.showPass?'text':'password'}" autocomplete="new-password" enterkeyhint="done" placeholder="${x.passPh}" value="${esc(S.pass)}" style="padding-right:64px">
        <button class="btn-text" data-act="togglePass" style="position:absolute;right:4px;top:2px;font-size:14px">${S.showPass?x.hide:x.show}</button></div></div>
      <label class="check"><input type="checkbox" data-f="agree" ${S.agree?'checked':''}><span>${x.agreeA}<a href="#">${x.terms}</a>${x.agreeB}<a href="#">${x.policy}</a>.</span></label>`;

  }
  if (st === 2) {
    body = `
      <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">${x.step.replace('{n}',2)}</span><h1>${x.s2Title}</h1><p class="sub">${x.s2Sub}</p></div>
      <div class="field"><label for="f-birth">${x.birthL}</label><input class="input" id="f-birth" data-f="birth" type="date" autocomplete="bday" value="${esc(S.birth)}"><span class="small">${x.birthHint}</span></div>
      <div class="field"><label>${x.occL}</label><div class="chips">${x.occs.map((o,i)=>`<button class="chip" data-act="occ" data-v="${i}" aria-pressed="${S.occ.includes(i)}">${o}</button>`).join('')}</div></div>

    foot = `<button class="btn btn-primary" data-act="next" data-valid="2" ${valid[2]()?'':'disabled'}>${x.cont}</button>`;
  }
  if (st === 3) {

      <div class="grid2">${num('height',x.height,'cm','160')}${num('weight',x.weight,'kg','50')}</div>

    const checks = [[x.cAcc, x.done, true],[x.cWeather, S.weather?x.on:x.off, S.weather],[x.cModel, S.model?x.done:x.later, S.model]];
    body = `

    foot = `<button class="btn btn-primary" data-act="enterApp">${x.enter}</button><button class="btn-text" data-act="restart">${x.review}</button>`;
  }
  return `<div class="top"><div style="width:96px;display:flex">${left}</div>${prog}<div style="width:96px;display:flex;justify-content:flex-end">${langSwitch()}</div></div>
    <div class="scroll"><div class="pad">${body}</div></div><div class="foot">${foot}</div>`;
}

/* ============ Render & events ============ */
const app = document.getElementById('app');
function render() {
  document.documentElement.lang = S.lang;
  const focusId = document.activeElement && document.activeElement.id;
  const scrollEl = app.querySelector('.scroll'), y = scrollEl ? scrollEl.scrollTop : 0;
  app.innerHTML = (S.screen === 'signup' ? signup() : appShell()) + (S.toast ? `<div role="status" style="position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;z-index:9">${S.toast}</div>` : '');
  const s2 = app.querySelector('.scroll'); if (s2 && keepScroll) s2.scrollTop = y;
  keepScroll = false;
  if (focusId) { const f = document.getElementById(focusId); if (f) f.focus(); }
}
let keepScroll = false;
function toast(msg) { S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = ''; render(); }, 2200); }

// Typing updates state without re-rendering (keeps the keyboard open)
app.addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f || f === 'agree') return;
  S[f] = e.target.value; save();
  const b = app.querySelector('[data-valid]'); if (b) b.disabled = !valid[b.dataset.valid]();
});
app.addEventListener('change', e => {
  if (e.target.dataset.f === 'agree') { S.agree = e.target.checked; save(); const b = app.querySelector('[data-valid]'); if (b) b.disabled = !valid[1](); }
  if (e.target.dataset.f === 'birth') { S.birth = e.target.value; save(); const b = app.querySelector('[data-valid]'); if (b) b.disabled = !valid[2](); }
  if (e.target.dataset.actChange === 'photo' && e.target.files.length) set({scanned:true});
});

const actions = {
  lang: v => { keepScroll = true; set({lang:v}); },
  back: () => set({step: Math.max(1, S.step - 1)}),
  togglePass: () => set({showPass: !S.showPass}),
  social: () => toast(en() ? 'Demo: connect Apple / Google sign-in here' : 'Bản demo: gắn đăng nhập Apple / Google tại đây'),
  next: () => { if (valid[S.step]()) set({step: S.step + 1}); },
  occ: v => { const i = +v; keepScroll = true; set({occ: S.occ.includes(i) ? S.occ.filter(x => x !== i) : S.occ.concat(i)}); },
  weather: () => {
    const on = !S.weather; keepScroll = true; set({weather: on});
    if (on && navigator.geolocation) navigator.geolocation.getCurrentPosition(() => {}, () => {});
  },
  createModel: () => { if (valid[3]()) set({step:4, model:true}); },
  skipModel: () => set({step:4, model:false}),
  restart: () => set({step:1}),
  enterApp: () => set({screen:'app', tab:'home'}),
  tab: v => set({tab:v}),
  premium: () => set({premium:true}),
  closePremium: () => set({premium:false}),
  plan: v => set({plan:+v}),
  buy: () => toast(t().demoPay),
  wear: () => { keepScroll = true; set({worn: !S.worn}); },
  shuffle: () => { keepScroll = true; set({today: (S.today + 1) % OUTFITS.length, worn:false}); },
  goOcc: v => set({tab:'outfits', occSel:+v}),
  cat: v => set({cat:+v}),
  occSel: v => set({occSel:+v}),
  like: v => { keepScroll = true; S.likes[v] = !S.likes[v]; S.nopes[v] = false; set({}); },
  nope: v => { keepScroll = true; S.nopes[v] = !S.nopes[v]; S.likes[v] = false; set({}); },
  tryOn: v => set({tab:'model', mi:+v}),
  prevM: () => set({mi: (S.mi + OUTFITS.length - 1) % OUTFITS.length}),
  nextM: () => set({mi: (S.mi + 1) % OUTFITS.length}),
  editModel: () => set({screen:'signup', step:3}),
  delModel: () => { if (confirm(t().delConfirm)) set({model:false, height:'', weight:'', bust:'', waist:'', hip:''}); },
  notify: () => { keepScroll = true; set({notify: !S.notify}); },
  openScan: () => set({scan:true, scanned:false}),
  closeScan: () => set({scan:false, scanned:false}),
  shoot: () => set({scanned:true}),
  retake: () => set({scanned:false}),
  saveItem: () => {
    const nm = (S.iname || '').trim() || t().itemPh;
    S.extra = S.extra.concat([['shirt','#F6F3EC',1,nm,nm,'Linen · Trắng kem','Linen · Cream white']]);
    S.iname = ''; Object.assign(S, {scan:false, scanned:false, tab:'wardrobe', cat:0}); save(); toast(t().saved);
  }
};
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('overlay') && e.target.closest('[data-stop]')) return; // clicks inside the sheet
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.v); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.premium) set({premium:false}); });

render();
</script>
</body>
</html>
